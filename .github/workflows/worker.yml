name: worker

# O trabalho pesado não cabe numa função serverless da Vercel: o plano
# Hobby corta em 10 segundos e uma busca na Overpass leva de 5 a 60.
# Aqui o worker tem minutos à vontade.
on:
  schedule:
    # A cada 5 minutos. O agendamento do GitHub é best effort e atrasa em
    # horário de pico, então na prática é "no mínimo a cada 5 minutos".
    - cron: "*/5 * * * *"
  # Permite rodar na mão pelo site do GitHub, sem esperar o cron.
  workflow_dispatch:

# Impede duas execuções ao mesmo tempo. A sobreposição não corromperia
# dados — o lease dos jobs e o UNIQUE em osm_id protegem —, mas gastaria
# minutos de Actions à toa.
concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  processar:
    runs-on: ubuntu-latest
    # Rede fora do ar ou Overpass travada não podem prender um runner.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run worker
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OSM_CONTATO: ${{ secrets.OSM_CONTATO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
