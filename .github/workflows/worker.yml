name: worker

# O trabalho pesado não cabe numa função serverless da Vercel: o plano
# Hobby corta em 10 segundos e uma busca na Overpass leva de 5 a 60.
#
# Modelo de plantão: cada execução fica de pé por ~2 h olhando a fila a
# cada 20 segundos e, ao terminar, dispara a próxima. Duas horas e não
# seis para uma mudança no código do worker entrar em no máximo 2 h. O cron de 5 minutos
# continua só como reserva — o GitHub não o honra em repositório público
# (virou "a cada 4 ou 5 horas" na prática), mas se a corrente quebrar ele
# a recomeça. Minutos são ilimitados em repositório público.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Mudou o worker: começa um plantão novo (o atual termina e não relança
  # por cima — a concorrência abaixo garante um de cada vez).
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker.yml"
      - "src/worker/**"
      - "src/lib/**"
      - "src/db/**"
  workflow_dispatch:
    inputs:
      motivo:
        description: "Só informativo (ex.: relançamento automático)."
        required: false
        default: ""

# Uma execução por vez, e a mais nova ganha: um push com código novo
# derruba o plantão que está rodando e começa outro na hora — é o que
# faz uma correção valer em um minuto em vez de em duas horas. Cortar um
# plantão no meio não perde nada: o job em andamento volta à fila quando
# o lease vence (10 min) e as gravações são idempotentes.
concurrency:
  group: worker
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  processar:
    runs-on: ubuntu-latest
    # O plantão para aos 110 min por conta própria; o teto é folga.
    timeout-minutes: 125

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - id: plantao
        run: npm run worker
        env:
          WORKER_DURACAO_MIN: "110"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OSM_CONTATO: ${{ secrets.OSM_CONTATO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SEGREDO_SESSAO: ${{ secrets.SEGREDO_SESSAO }}

      # Relança quando o plantão terminou ou morreu com erro — senão a
      # corrente quebra numa queda de rede e só o cron (horas depois) a
      # retoma. NÃO quando foi cancelado: cancelado significa que um
      # plantão mais novo já tomou o lugar, e relançar daqui derrubaria
      # justamente ele.
      - if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run worker.yml --ref main -f motivo="relançamento automático"
