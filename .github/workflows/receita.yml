name: receita

# Importa a base de CNPJs da Receita Federal para o Cloudflare D1.
#
# É um job longo (20 a 60 minutos): baixa ~6 GB de zip, lê ~17 GB de CSV
# em fluxo e grava só o recorte dos estados escolhidos em Ajustes. Não
# cabe no worker de 5 minutos nem numa função da Vercel — por isso tem
# fluxo próprio, com timeout largo e sem concorrência com ele mesmo.
#
# DESLIGADO o agendamento (07/10/2026): desde a v2 a busca é pelo Google
# Maps, e a Receita só servia de complemento às buscas pelo OpenStreetMap.
# Uma importação grava centenas de milhares de linhas — mais que a cota
# diária do D1 gratuito (100 mil), o que deixava o painel fora do ar no
# dia 15. Continua disponível para rodar à mão (Actions → receita → Run).
on:
  workflow_dispatch:
    inputs:
      ufs:
        description: "Estados (ex.: AM,PA). Vazio usa o que está salvo em Ajustes."
        required: false
        default: ""
      referencia:
        description: "Pasta da Receita (ex.: 2026-09). Vazio usa a mais recente."
        required: false
        default: ""
      rodada:
        description: "Contador interno das continuações. Deixe 1."
        required: false
        default: "1"

concurrency:
  group: receita
  cancel-in-progress: false

permissions:
  contents: read
  # Para a rodada disparar a seguinte quando o tempo acaba antes da base.
  actions: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - id: importar
        run: npm run receita
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECEITA_UFS: ${{ inputs.ufs }}
          RECEITA_REFERENCIA: ${{ inputs.referencia }}

      # O D1 gratuito grava ~15 mil linhas por minuto; a base inteira
      # não cabe numa rodada. Quando o importador parou por tempo — ou
      # caiu por um soluço de rede — dispara a próxima com a mesma
      # referência. Teto de 8 rodadas: se não fechou em 8, algo está
      # errado e é melhor parar do que rodar para sempre.
      - if: always() && (steps.importar.outputs.continuar == 'true' || steps.importar.outcome == 'failure') && (inputs.rodada || '1') < 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proxima=$(( ${{ inputs.rodada || '1' }} + 1 ))
          gh workflow run receita.yml --ref main \
            -f ufs="${{ inputs.ufs }}" \
            -f referencia="${{ steps.importar.outputs.referencia || inputs.referencia }}" \
            -f rodada="$proxima"
          echo "Rodada $proxima disparada."
